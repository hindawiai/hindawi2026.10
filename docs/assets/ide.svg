<text x="868" y="236" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">#شامل &lt;stdio.h&gt;</text>
<text x="868" y="256" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">/* binary search in a sorted array */</text>
<text x="868" y="276" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">صحیح ثنائی_تلاش(صحیح اقدار[], صحیح گنتی, صحیح کلید) {</text>
<text x="868" y="296" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">  صحیح کم = 0, بلند = گنتی - 1;</text>
<text x="868" y="316" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">  جب (کم &lt;= بلند) {</text>
<text x="868" y="336" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">    صحیح درمیان = کم + (بلند - کم) / 2;</text>
<text x="868" y="356" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">    اگر (اقدار[درمیان] == کلید) واپس درمیان;</text>
<text x="868" y="376" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">    اگر (اقدار[درمیان] &lt; کلید) کم = درمیان + 1; ورنہ بلند = درمیان - 1;</text>
<text x="868" y="396" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">  }</text>
<text x="868" y="416" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">  واپس -1;</text>
<text x="868" y="436" direction="rtl" text-anchor="start" unicode-bidi="plaintext" font-family="Noto Nastaliq Urdu,Noto Naskh Arabic,ui-monospace,monospace" font-size="14" fill="#1d1b17">}</text>
